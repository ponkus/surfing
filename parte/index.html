<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Playa Grande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --text:#f3f8fc; --muted:rgba(233,243,250,.68); --dim:rgba(233,243,250,.42);
    --glass:rgba(8,20,34,.46); --glass2:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.10);
    --bio:#2fe0c8; --yacht:#ff8f6b; --good:#3ee39a; --ok:#ffd166; --bad:#ff6b7a;
    --sky1:#050b18; --sky2:#0d1f35;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:"Outfit",-apple-system,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%);transition:background 2s;
    overflow:hidden;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .app{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:18px 22px 20px}
  @media (max-width:900px){ body{overflow:auto} .app{height:auto} }

  /* top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:3px;font-size:14px;color:var(--muted)}
  .brand svg{width:28px;height:28px}
  .clock{text-align:right}
  .clock .t{font-size:30px;font-weight:300;letter-spacing:1px;line-height:1}
  .clock .d{font-size:13px;color:var(--dim);margin-top:3px}

  .main{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;min-height:0}
  @media (max-width:900px){.main{grid-template-columns:1fr}}
  .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
  .lite .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(8,20,34,.72)}

  /* hero */
  .hero{padding:22px 26px;display:flex;flex-direction:column;gap:14px;min-height:0}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .eyebrow{font-size:13px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .live{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(62,227,154,.7);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(62,227,154,0)}100%{box-shadow:0 0 0 0 rgba(62,227,154,0)}}
  .spotname{font-size:76px;font-weight:800;line-height:.95;letter-spacing:-1px;margin-top:6px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .height{font-size:44px;font-weight:300;margin-top:6px}
  .height b{font-weight:700}
  .height small{font-size:20px;color:var(--muted);margin-left:4px}
  .gauge{position:relative;width:132px;height:132px;flex:none}
  .gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
  .gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .val b{font-size:40px;font-weight:700;line-height:1}
  .gauge .val span{font-size:12px;color:var(--dim);letter-spacing:2px;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:8px;padding:8px 13px 8px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--stroke);font-size:15px;color:var(--muted)}
  .chip svg{width:18px;height:18px;flex:none}
  .chip.good{color:#c9f7e2;border-color:rgba(62,227,154,.35);background:rgba(62,227,154,.10)}
  .chip.ok{color:#ffeab3;border-color:rgba(255,209,102,.30);background:rgba(255,209,102,.08)}
  .chip.bad{color:#ffc6cc;border-color:rgba(255,107,122,.30);background:rgba(255,107,122,.08)}

  .nextwin{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--stroke);font-size:16px;color:var(--muted)}
  .nextwin b{color:var(--text);font-weight:600}
  .nextwin .tag{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
  .spots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
  .sp{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--glass2);border:1px solid var(--stroke);position:relative;overflow:hidden}
  .sp.win{border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent) inset}
  .sp .dial{width:104px;height:104px;flex:none}
  .sp .nm{font-size:15px;font-weight:600;color:var(--c);letter-spacing:.5px}
  .sp .hv{font-size:28px;font-weight:700;margin:2px 0}
  .sp .hv small{font-size:14px;color:var(--muted);font-weight:400}
  .dots{display:flex;gap:4px;margin:4px 0}
  .dots i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
  .dots i.on{background:var(--c)}
  .dots i.half{background:linear-gradient(90deg,var(--c) 50%,rgba(255,255,255,.14) 50%)}
  .sp .why{font-size:12.5px;color:var(--dim);line-height:1.45}

  /* right column */
  .side{display:grid;grid-template-rows:auto auto;gap:14px;min-height:0;align-content:start}
  .tide{padding:18px 20px 12px}
  .tide h3{font-size:13px;letter-spacing:3px;color:var(--dim);font-weight:500;text-transform:uppercase;display:flex;justify-content:space-between}
  .tide .state{font-size:26px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:10px}
  .tide .next{font-size:15px;color:var(--muted);margin-top:2px}
  .bombeo{display:none;margin-top:10px;padding:9px 12px;border-radius:12px;background:rgba(62,227,154,.10);border:1px solid rgba(62,227,154,.3);color:#c9f7e2;font-size:14px;align-items:center;gap:8px}
  .bombeo svg{width:18px;height:18px}
  .wx{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{padding:14px 12px;text-align:center}
  .tile svg{width:34px;height:34px;display:block;margin:0 auto 6px}
  .tile b{font-size:28px;font-weight:600;display:block;line-height:1.1}
  .tile span{font-size:12.5px;color:var(--dim);display:block;margin-top:3px;line-height:1.35}

  /* days */
  .foot{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:14px;align-items:stretch}
  @media (max-width:900px){.foot{grid-template-columns:1fr 1fr}}
  .day{padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px}
  .day .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);text-transform:capitalize}
  .day .top svg{width:22px;height:22px}
  .day .who{font-size:22px;font-weight:700}
  .day .meta{font-size:13px;color:var(--dim)}
  .day svg.spark{width:100%;height:38px;margin-top:4px}
  .rate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 22px;border-radius:24px;border:0;cursor:pointer;
        background:linear-gradient(135deg,#2fe0c8,#3aa0ff);color:#04202a;font-family:inherit;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(47,224,200,.25)}
  .rate svg{width:30px;height:30px}
  .rate small{font-weight:500;font-size:11.5px;opacity:.75;max-width:120px;text-align:center}

  .err{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:30;padding:8px 14px;border-radius:12px;background:rgba(80,20,30,.85);color:#ffd2d7;font-size:14px}

  /* modal */
  .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(2,8,16,.6);backdrop-filter:blur(6px);padding:16px}
  .modal.open{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:min(680px,100%);padding:24px;max-height:94vh;overflow:auto;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{font-size:26px;font-weight:700}
  .sheet .when{font-size:13px;color:var(--dim);margin-top:2px}
  .q{font-size:12px;letter-spacing:2.5px;color:var(--dim);margin:18px 0 8px;text-transform:uppercase}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-family:inherit;font-size:17px;color:var(--text);background:var(--glass2);border:1.5px solid var(--stroke);border-radius:14px;padding:12px 16px;cursor:pointer;min-width:60px;transition:all .15s}
  .opt.sel{background:rgba(47,224,200,.16);border-color:#2fe0c8;color:#fff}
  .opts.stars .opt{font-size:20px;letter-spacing:2px;color:var(--ok)}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  .btn{font-family:inherit;font-size:17px;font-weight:700;border-radius:14px;padding:13px 22px;border:0;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,#2fe0c8,#3aa0ff);color:#04202a}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--stroke);font-weight:500}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .3s;z-index:40;padding:12px 20px;border-radius:14px;background:#2fe0c8;color:#04202a;font-weight:700}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .fadein{animation:fadein .6s both}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>

function wxIcon(code, day=1){
  if(code===0) return day?I.sun:I.moon;
  if(code<=2) return day?I.partly:I.cloud;
  if(code===3) return I.cloud;
  if(code<=48) return I.fog;
  if(code<=67 || (code>=80&&code<=82)) return I.rain;
  if(code<=77) return I.cloud;
  return I.storm;
}
const wxText = c => c===0?"Despejado":c<=2?"Algo nublado":c===3?"Nublado":c<=48?"Niebla":c<=57?"Llovizna":c<=67?"Lluvia":c<=77?"Nieve":c<=82?"Chaparrones":"Tormenta";

/* ===================== FÍSICA (igual que v1) ===================== */
const NORMAL = T.normal;
const breakH = (H,Tp) => 0.39*Math.pow(9.81,0.2)*Math.pow(Tp*H*H,0.4);
const spreadFor = Tp => Tp<8?"45":Tp<11?"30":"20";
const expo = (spot,dir,Tp) => T.exp[spot][spreadFor(Tp)][Math.round(((dir%360)+360)%360)%360];
const windF = (spot,dir) => T.wind[spot][Math.round(((dir%360)+360)%360)%360];
function sizeScore(hb){ if(hb<0.45) return 0; if(hb<0.9) return (hb-0.45)/0.45; if(hb<=2.0) return 1; return Math.max(0.3,1-(hb-2)/1.5); }
function windScore(spot,spd,dir){
  const on = Math.cos(rad(angdiff(dir,NORMAL)));
  if(on<=-0.3) return spd<30?1:Math.max(0.5,1-(spd-30)/40);
  return Math.max(0,1-spd*windF(spot,dir)*Math.max(on,0.35)/22);
}
function tideQ(g){
  if(g>1.05) return {q:Math.max(0.35,1-(g-1.05)*0.8), txt:"poca agua", tone:"bad"};
  if(g>=0.7) return {q:1, txt:"rompe en el banco", tone:"good"};
  if(g>=0.55) return {q:0.85, txt:"algo gorda", tone:"ok"};
  return {q:Math.max(0.5,0.85-(0.55-g)*1.5), txt:"mucha agua, gorda", tone:"bad"};
}

/* ===================== DATOS ===================== */
let D = null;
async function load(){
  const mv = "swell_wave_height,swell_wave_period,swell_wave_direction,secondary_swell_wave_height,secondary_swell_wave_period,secondary_swell_wave_direction,wind_wave_height,wind_wave_period,wind_wave_direction,sea_level_height_msl,sea_surface_temperature";
  const wv = "wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,apparent_temperature,weather_code,precipitation_probability,is_day";
  const dv = "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset";
  const q = (p,o) => `latitude=${p.lat}&longitude=${p.lon}&timezone=${encodeURIComponent(CFG.tz)}&past_days=1&forecast_days=5&${o}`;
  const get = u => fetch(u).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
  const [m,w] = await Promise.all([
    get(`https://marine-api.open-meteo.com/v1/marine?${q(CFG.marine,"hourly="+mv)}`),
    get(`https://api.open-meteo.com/v1/forecast?${q(CFG.weather,"hourly="+wv+"&daily="+dv)}`)
  ]);
  const idx = {}; w.hourly.time.forEach((t,i)=>idx[t]=i);
  const H = [];
  m.hourly.time.forEach((t,i)=>{
    const j = idx[t]; if(j===undefined) return;
    const g = (o,k,ii) => o.hourly[k][ii];
    H.push({
      t, ms:parseLocal(t),
      parts:[
        {h:g(m,"swell_wave_height",i), p:g(m,"swell_wave_period",i), d:g(m,"swell_wave_direction",i), k:"swell"},
        {h:g(m,"secondary_swell_wave_height",i), p:g(m,"secondary_swell_wave_period",i), d:g(m,"secondary_swell_wave_direction",i), k:"swell2"},
        {h:g(m,"wind_wave_height",i), p:g(m,"wind_wave_period",i), d:g(m,"wind_wave_direction",i), k:"viento"}
      ].filter(x=>x.h!=null && x.p!=null && x.d!=null && x.h>0.05),
      ww:{h:g(m,"wind_wave_height",i)||0, d:g(m,"wind_wave_direction",i)||0},
      eta:g(m,"sea_level_height_msl",i), sst:g(m,"sea_surface_temperature",i),
      ws:g(w,"wind_speed_10m",j), wd:g(w,"wind_direction_10m",j), wg:g(w,"wind_gusts_10m",j),
      temp:g(w,"temperature_2m",j), app:g(w,"apparent_temperature",j), code:g(w,"weather_code",j),
      pp:g(w,"precipitation_probability",j), day:g(w,"is_day",j)
    });
  });
  D = {H, daily:w.daily, fetched:Date.now()};
  try{ localStorage.setItem("pg_cache", JSON.stringify(D)); }catch(e){}
}

/* ===================== MAREA ===================== */
let TIDE=null;
function buildTide(){
  const H = D.H.filter(h=>h.eta!=null);
  const mean = H.reduce((a,h)=>a+h.eta,0)/H.length, off = CFG.TIDE_OFFSET_MIN*60000;
  const pts = H.map(h=>({ms:h.ms+off, y:h.eta-mean}));
  const ext=[];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1].y,b=pts[i].y,c=pts[i+1].y, hi=b>a&&b>=c, lo=b<a&&b<=c;
    if(!hi&&!lo) continue;
    const den=a-2*b+c, dx=den!==0?0.5*(a-c)/den:0;
    ext.push({ms:pts[i].ms+dx*3600000, y:b-0.25*(a-c)*dx, type:hi?"alta":"baja"});
  }
  TIDE={pts,ext,mean};
}
function etaAt(ms){
  const p=TIDE.pts; if(ms<=p[0].ms) return p[0].y; if(ms>=p[p.length-1].ms) return p[p.length-1].y;
  const i=p.findIndex(x=>x.ms>ms), A=p[i-1], B=p[i]; return A.y+(B.y-A.y)*(ms-A.ms)/(B.ms-A.ms);
}
function tideInfo(ms){
  const y=etaAt(ms), rising=etaAt(ms+1800000)>y;
  let near=null; for(const e of TIDE.ext){ const dm=(e.ms-ms)/60000; if(!near||Math.abs(dm)<Math.abs(near.dm)) near={...e,dm}; }
  const nextE=TIDE.ext.filter(e=>e.ms>ms).slice(0,2);
  const lvl=y<-0.3?"muy baja":y<-0.1?"baja":y<0.1?"media":y<0.3?"alta":"muy alta";
  return {y,rising,near,nextE,lvl};
}

/* ===================== MODELO ===================== */
function evalHour(h, spot){
  let sum=0, dom=null, domv=-1; const detail=[];
  for(const p of h.parts){
    const w=p.k==="viento"?0.6:1, e=expo(spot,p.d,p.p), hb=breakH(p.h,p.p)*e*w;
    sum+=hb*hb; detail.push({...p,e,hb}); if(hb>domv){domv=hb;dom={...p,e};}
  }
  const hb=Math.sqrt(sum)*CFG.SIZE_CAL[spot], Tp=dom?dom.p:0, ti=tideInfo(h.ms);
  const g=hb/Math.max(0.2,CFG.D_BAR[spot]+ti.y), tq=tideQ(g);
  const chop=angdiff(h.ww.d,NORMAL)<90?h.ww.h*expo(spot,h.ww.d,4):0;
  const ws=windScore(spot,h.ws,h.wd);
  let s=sizeScore(hb)*ws*Math.max(0.3,1-chop/0.8)*tq.q, bombeo=false;
  if(ti.near&&Math.abs(ti.near.dm)<=CFG.BOMBEO_MIN&&hb>=0.5&&hb<=1.6){ bombeo=true; s*=1+(Tp>=9?0.15:0.07)*(spot==="Yacht"?1.3:1); }
  if(Tp>=9) s*=1.15;
  s=clamp(s,0,1);
  return {spot,hb,stars:Math.round(s*10)/2,score:s,g,tq,ws,dom,detail,bombeo,ti};
}
function chipsFor(r,h){
  const c=[];
  if(r.dom){ const d=r.dom, tone=d.e>0.7?"good":d.e>0.4?"ok":"bad", tag=d.e>0.7?"entra directo":d.e>0.4?"entra a medias":"tapado";
    c.push({i:I.swell,t:`${d.k==="viento"?"Mar de viento":"Swell"} ${compass(d.d)} ${d.p.toFixed(0)}s · ${tag}`,tone}); }
  const on=Math.cos(rad(angdiff(h.wd,NORMAL))), wf=windF(r.spot,h.wd);
  if(on<=-0.3) c.push({i:I.wind,t:`${compass(h.wd)} ${Math.round(h.ws)} km/h · offshore`,tone:h.ws<30?"good":"ok"});
  else if(wf<0.4) c.push({i:I.wind,t:`${compass(h.wd)} ${Math.round(h.ws)} km/h · reparado`,tone:"ok"});
  else c.push({i:I.wind,t:`${compass(h.wd)} ${Math.round(h.ws)} km/h · ${on>0.5?"onshore":"cruzado"}`,tone:h.ws<10?"ok":"bad"});
  c.push({i:I.tide,t:`Marea ${r.ti.lvl} ${r.ti.rising?"↗":"↘"} · ${r.tq.txt}`,tone:r.tq.tone});
  if(r.bombeo) c.push({i:I.pump,t:"Cambio de marea: bombeo",tone:"good"});
  return c;
}

    <circle cx="66" cy="66" r="${R}" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="val"><b>${stars.toFixed(1).replace(".0","")}</b><span>DE 5</span></div>`;
}
const dots = s => Array.from({length:5},(_,i)=>`<i class="${s>=i+1?"on":s>=i+0.5?"half":""}"></i>`).join("");

/* dial: abanico de exposición del pico + flechas de swell y viento */
function dialSVG(spot, r, h){
  const cx=52, cy=52, R=40, col=COLOR[spot][0];
  let pts=[]; for(let a=0;a<360;a+=6){ const e=expo(spot,a,8); pts.push([cx+R*e*Math.sin(rad(a)), cy-R*e*Math.cos(rad(a))]); }
  const fan = "M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L")+"Z";
  // tierra: semiplano al oeste de la costa (rumbo 15°)
  const cb=NORMAL-90, lx=Math.sin(rad(cb)), ly=-Math.cos(rad(cb)), wx=Math.sin(rad(NORMAL+180)), wy=-Math.cos(rad(NORMAL+180));
  const land = `M${cx+lx*60},${cy+ly*60} L${cx-lx*60},${cy-ly*60} L${cx-lx*60+wx*60},${cy-ly*60+wy*60} L${cx+lx*60+wx*60},${cy+ly*60+wy*60}Z`;
  const arrow = (dir,len,color,w,dash) => { const x1=cx+Math.sin(rad(dir))*(R+8), y1=cy-Math.cos(rad(dir))*(R+8), x2=cx+Math.sin(rad(dir))*(R+8-len), y2=cy-Math.cos(rad(dir))*(R+8-len);
    const a=Math.atan2(y2-y1,x2-x1), hx=x2-Math.cos(a-0.5)*7, hy=y2-Math.sin(a-0.5)*7, kx=x2-Math.cos(a+0.5)*7, ky=y2-Math.sin(a+0.5)*7;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" ${dash?'stroke-dasharray="3 3"':""}/><path d="M${hx},${hy}L${x2},${y2}L${kx},${ky}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`; };
  let s = `<svg class="dial" viewBox="0 0 104 104"><defs><clipPath id="cl${spot}"><circle cx="${cx}" cy="${cy}" r="${R+10}"/></clipPath><radialGradient id="rg${spot}"><stop offset="0" stop-color="${col}" stop-opacity=".55"/><stop offset="1" stop-color="${col}" stop-opacity=".12"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="${R+10}" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
    <path d="${land}" fill="rgba(255,255,255,.06)" clip-path="url(#cl${spot})"/>
    <circle cx="${cx}" cy="${cy}" r="${R/2}" fill="none" stroke="rgba(255,255,255,.06)"/>
    <path d="${fan}" fill="url(#rg${spot})" stroke="${col}" stroke-opacity=".6" stroke-width="1"/>
    <text x="${cx}" y="10" fill="rgba(255,255,255,.45)" font-size="8" text-anchor="middle" font-family="Outfit,system-ui,sans-serif">N</text>`;
  const main = r.dom; if(main) s += arrow(main.d, 26, "#fff", 2.6, false);
  s += arrow(h.wd, 18, "rgba(255,255,255,.55)", 1.6, true);
  s += `<circle cx="${cx}" cy="${cy}" r="3" fill="${col}"/></svg>`;
  return s;
}

function tideSVG(now){
  const d0=new Date(now); d0.setHours(0,0,0,0); const t0=d0.getTime(), t1=t0+86400000;
  const W=520,Hh=130,pl=8,pr=8,pt=22,pb=20;
  const ys=[]; for(let ms=t0;ms<=t1;ms+=1800000) ys.push(etaAt(ms));
  const ymin=Math.min(...ys)-0.08, ymax=Math.max(...ys)+0.08;
  const X=ms=>pl+(ms-t0)/(t1-t0)*(W-pl-pr), Y=y=>pt+(1-(y-ymin)/(ymax-ymin))*(Hh-pt-pb);
  let line=""; for(let ms=t0;ms<=t1;ms+=900000) line+=(line?"L":"M")+X(ms).toFixed(1)+","+Y(etaAt(ms)).toFixed(1);
  const area=line+`L${X(t1)},${Hh-pb}L${X(t0)},${Hh-pb}Z`;
  let s=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="margin-top:8px;overflow:visible"><defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa0ff" stop-opacity=".45"/><stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#2fe0c8"/><stop offset="1" stop-color="#3aa0ff"/></linearGradient></defs>`;
  for(const e of TIDE.ext){ if(e.ms<t0-3600000||e.ms>t1+3600000) continue;
    const a=Math.max(pl,X(e.ms-CFG.BOMBEO_MIN*60000)), b=Math.min(W-pr,X(e.ms+CFG.BOMBEO_MIN*60000));
    if(b>a) s+=`<rect x="${a}" y="${pt-8}" width="${b-a}" height="${Hh-pt-pb+8}" rx="8" fill="#3ee39a" opacity=".09"/>`; }
  s+=`<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="url(#tl)" stroke-width="3" stroke-linecap="round"/>`;
  for(const e of TIDE.ext){ if(e.ms<t0||e.ms>t1) continue;
    s+=`<circle cx="${X(e.ms)}" cy="${Y(e.y)}" r="3.5" fill="#0b1828" stroke="#cfe3ff" stroke-width="1.5"/>
        <text x="${X(e.ms)}" y="${e.type==="alta"?Y(e.y)-9:Y(e.y)+17}" fill="rgba(233,243,250,.75)" font-size="12" text-anchor="middle" font-family="Outfit,system-ui,sans-serif">${fmtT(e.ms)}</text>`; }
  const ny=Y(etaAt(now));
  s+=`<line x1="${X(now)}" x2="${X(now)}" y1="${pt-8}" y2="${Hh-pb}" stroke="rgba(255,209,102,.5)" stroke-dasharray="3 4"/>
      <circle cx="${X(now)}" cy="${ny}" r="10" fill="#ffd166" opacity=".25"><animate attributeName="r" values="6;13;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="${X(now)}" cy="${ny}" r="5" fill="#ffd166"/>`;
  [0,6,12,18,24].forEach(hh=>s+=`<text x="${X(t0+hh*3600000)}" y="${Hh-3}" fill="rgba(233,243,250,.35)" font-size="11" text-anchor="${hh===0?"start":hh===24?"end":"middle"}" font-family="Outfit,system-ui,sans-serif">${hh}h</text>`);
  return s+"</svg>";
}

function sparkSVG(hrs){
  const W=240,Hh=38; if(!hrs.length) return "";
  const t0=hrs[0].ms, t1=hrs[hrs.length-1].ms||t0+1;
  const X=ms=>(ms-t0)/Math.max(1,t1-t0)*W, Y=s=>Hh-3-s*(Hh-6);
  let out=`<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">`;
  for(const sp of SPOTS){
    const pts=hrs.map(h=>[X(h.ms),Y(evalHour(h,sp).score)]);
    const l="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L");
    out+=`<path d="${l}L${W},${Hh}L0,${Hh}Z" fill="${COLOR[sp][0]}" opacity=".10"/><path d="${l}" fill="none" stroke="${COLOR[sp][0]}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  return out+"</svg>";
}

/* ===================== RENDER ===================== */
const rangeTxt = hb => hb<0.15?`<b>plano</b>`:`<b>${Math.max(0,hb*0.8).toFixed(1)}–${(hb*1.2).toFixed(1)}</b><small>m</small>`;
const currentHourIdx = () => { const now=Date.now(); let b=0; D.H.forEach((h,i)=>{ if(h.ms<=now) b=i; }); return b; };
const dayLight = ds => { const i=D.daily.time.indexOf(ds); return i<0?null:{rise:parseLocal(D.daily.sunrise[i]), set:parseLocal(D.daily.sunset[i]), i}; };
let SCENE = {hb:0.5, Tp:8, eta:0, ws:10, wd:270, rise:0, set:0};

function render(){
  buildTide();
  const now=Date.now(), hNow=D.H[currentHourIdx()], today=hNow.t.slice(0,10), dl=dayLight(today);
  const night = dl && (now<dl.rise-1800000 || now>dl.set);
  // de noche, la tarjeta principal muestra la mejor hora de la próxima mañana/día
  let h=hNow, heroLbl="Ahora", dayWord="Hoy";
  if(night){
    const tgtDate = now>dl.set ? D.daily.time[dl.i+1] : today, L2 = tgtDate?dayLight(tgtDate):null;
    if(L2){ const hrs=D.H.filter(x=>x.t.startsWith(tgtDate)&&x.ms>=L2.rise-1800000&&x.ms<=L2.set);
      let bb=null; for(const x of hrs) for(const s of SPOTS){ const e=evalHour(x,s); if(!bb||e.score>bb.e.score) bb={e,x}; }
      if(bb){ h=bb.x; dayWord=tgtDate===today?"Hoy":"Mañana"; heroLbl=dayWord+" · mejor a las "+fmtT(bb.x.ms); } }
  }
  const R={}; SPOTS.forEach(s=>R[s]=evalHour(h,s));
  const best=R.Biologia.score>=R.Yacht.score?"Biologia":"Yacht", r=R[best];
  const none = Math.max(R.Biologia.score,R.Yacht.score)<0.1;

  document.documentElement.style.setProperty("--c1", none?"#8aa3b8":COLOR[best][0]);
  document.documentElement.style.setProperty("--c2", none?"#c7d6e2":COLOR[best][1]);
  $("eyebrow").textContent = heroLbl;
  // próxima ventana buena (≥ 2.5 estrellas) con luz de día
  let nw=null;
  for(const x of D.H){ if(x.ms<now) continue; const L3=dayLight(x.t.slice(0,10)); if(!L3||x.ms<L3.rise||x.ms>L3.set) continue;
    const es=SPOTS.map(s=>evalHour(x,s)).sort((a,b)=>b.score-a.score); if(es[0].score>=0.5){ nw={x,e:es[0]}; break; } }
  $("nextwin").innerHTML = nw
    ? `<span class="tag">Próxima buena</span><span><b>${new Date(nw.x.ms).toLocaleDateString("es-AR",{weekday:"long"})} ${fmtT(nw.x.ms)}</b> · <span style="color:${COLOR[nw.e.spot][0]}">${NAME[nw.e.spot]}</span> ${(nw.e.hb*0.8).toFixed(1)}–${(nw.e.hb*1.2).toFixed(1)} m · ${nw.e.stars} ★</span>`
    : `<span class="tag">Próxima buena</span><span>No aparece en los próximos días</span>`;
  $("spotname").textContent = none?dayWord+" no":NAME[best];
  $("height").innerHTML = none?`<small style="margin:0">máx</small> ${rangeTxt(Math.max(R.Biologia.hb,R.Yacht.hb))}`:rangeTxt(r.hb);
  $("gauge").innerHTML = gaugeSVG(r.stars, none?"#8aa3b8":COLOR[best][0], none?"#c7d6e2":COLOR[best][1]);
  $("chips").innerHTML = chipsFor(r,h).map(c=>`<div class="chip ${c.tone}">${c.i}<span>${c.t}</span></div>`).join("");
  $("spots").innerHTML = SPOTS.map(s=>{ const x=R[s];
    const why = x.detail.slice().sort((a,b)=>b.hb-a.hb).slice(0,2).map(p=>`${compass(p.d)} ${p.p.toFixed(0)}s → ${Math.round(p.e*100)}%`).join(" · ");
    return `<div class="sp ${s===best&&!none?"win":""}" style="--c:${COLOR[s][0]}">${dialSVG(s,x,h)}
      <div><div class="nm">${NAME[s].toUpperCase()}</div><div class="hv">${x.hb<0.15?"plano":`${(x.hb*0.8).toFixed(1)}–${(x.hb*1.2).toFixed(1)}<small> m</small>`}</div>
      <div class="dots">${dots(x.stars)}</div><div class="why">${why}<br>${x.tq.txt}</div></div></div>`; }).join("");

  // marea
  const ti=tideInfo(now);
  $("tideState").innerHTML = `<span style="color:${ti.rising?"#2fe0c8":"#7ac7ff"}">${ti.rising?"↗":"↘"}</span> ${ti.rising?"Subiendo":"Bajando"} · ${ti.lvl}`;
  $("tideNext").textContent = ti.nextE.map(e=>`${e.type==="alta"?"Pleamar":"Bajamar"} ${fmtT(e.ms)}`).join("   ·   ");
  $("tideChart").innerHTML = tideSVG(now);
  const nx=TIDE.ext.find(e=>e.ms>now-CFG.BOMBEO_MIN*60000), Tp=Math.max(...SPOTS.map(s=>R[s].dom?R[s].dom.p:0));
  if(nx && nx.ms-now<3*3600000){ $("bombeo").style.display="flex";
    $("bombeo").innerHTML = `${I.pump}<span>Cambio de marea ${fmtT(nx.ms)} · bombeo ${fmtT(nx.ms-CFG.BOMBEO_MIN*60000)}–${fmtT(nx.ms+CFG.BOMBEO_MIN*60000)}${Tp>=9?" · período largo ✓":""}</span>`;
  } else $("bombeo").style.display="none";

  // clima
  const di=dl?dl.i:0; let rise=dl?dl.rise:null, set=dl?dl.set:null, tmr=false;
  if(dl && now>dl.set && D.daily.sunrise[di+1]){ rise=parseLocal(D.daily.sunrise[di+1]); set=parseLocal(D.daily.sunset[di+1]); tmr=true; }
  const tc=D.daily.weather_code[di+1];
  $("wx").innerHTML = `
    <div class="glass tile fadein" style="animation-delay:.1s">${I.drop.replace('currentColor','#7ac7ff')}<b>${h.sst!=null?h.sst.toFixed(0):"–"}°</b><span>agua</span></div>
    <div class="glass tile fadein" style="animation-delay:.14s">${wxIcon(h.code,!night)}<b>${Math.round(h.temp)}°</b><span>${wxText(h.code)} · sens ${Math.round(h.app)}°</span></div>
    <div class="glass tile fadein" style="animation-delay:.18s">${I.sunrise}<b>${rise?fmtT(rise):"–"}</b><span>amanece${tmr?" mañana":""}<br>atardece ${set?fmtT(set):"–"}</span></div>`;

  // días
  const k0=Math.max(0,D.daily.time.indexOf(today)); let slot=0;
  for(let k=k0;k<D.daily.time.length&&slot<3;k++){
    const date=D.daily.time[k], L=dayLight(date);
    const hrs=D.H.filter(x=>x.t.startsWith(date)&&x.ms>=L.rise-1800000&&x.ms<=L.set);
    const fut=hrs.filter(x=>x.ms>=now-3600000); if(!fut.length) continue;
    let top=null; for(const x of fut) for(const s of SPOTS){ const e=evalHour(x,s); if(!top||e.score>top.r.score) top={r:e,h:x}; }
    const win=fut.filter(x=>evalHour(x,top.r.spot).score>=top.r.score-0.1);
    const tomorrow = D.daily.time[D.daily.time.indexOf(today)+1];
    const lbl = date===today?"Hoy":date===tomorrow?"Mañana":new Date(L.rise).toLocaleDateString("es-AR",{weekday:"long",day:"numeric"});
    const icon = wxIcon(D.daily.weather_code[k],1);
    $("d"+slot).innerHTML = `<div class="top"><span>${lbl}</span>${icon}</div>
      ${top.r.score<0.1?`<div class="who" style="color:var(--dim)">Sin ola</div><div class="meta">máx ${(top.r.hb*1.2).toFixed(1)} m · viento ${compass(top.h.wd)} ${Math.round(top.h.ws)}</div>`
      :`<div class="who" style="color:${COLOR[top.r.spot][0]}">${NAME[top.r.spot]} <span style="font-weight:400;color:var(--muted);font-size:17px">${(top.r.hb*0.8).toFixed(1)}–${(top.r.hb*1.2).toFixed(1)} m</span></div>
        <div class="meta"><span class="dots" style="display:inline-flex;vertical-align:middle;--c:${COLOR[top.r.spot][0]}">${dots(top.r.stars)}</span> &nbsp;${fmtT(win[0].ms)}–${fmtT(win[win.length-1].ms+3600000)} · ${compass(top.h.wd)} ${Math.round(top.h.ws)} km/h</div>`}
      ${sparkSVG(hrs)}`;
    slot++;
  }
  for(;slot<3;slot++) $("d"+slot).innerHTML="";

  $("tideUpd").textContent = "act. "+fmtT(D.fetched);
  renderRateMeta();
  // escena animada
  SCENE = {hb:r.hb, Tp:Tp||6, eta:ti.y, ws:h.ws, wd:h.wd, rise:dl?dl.rise:0, set:dl?dl.set:0};
  paintSky();
}

/* ===================== CIELO + MAR ANIMADO ===================== */
const SKY = { // [arriba, abajo]
  night:["#040a16","#0b1b30"], dawn:["#1a2350","#e27d5f"], day:["#0c3a63","#2b86b8"], dusk:["#1b1b45","#d1645a"]
};
function skyAt(now){
  const {rise,set}=SCENE; if(!rise) return SKY.night;
  const H=3600000, blend=(A,B,t)=>[mixHex(A[0],B[0],t),mixHex(A[1],B[1],t)];
  if(now<rise-H) return SKY.night;
  if(now<rise) return blend(SKY.night,SKY.dawn,(now-(rise-H))/H);
  if(now<rise+H) return blend(SKY.dawn,SKY.day,(now-rise)/H);
  if(now<set-H) return SKY.day;
  if(now<set) return blend(SKY.day,SKY.dusk,(now-(set-H))/H);
  if(now<set+H) return blend(SKY.dusk,SKY.night,(now-set)/H);
  return SKY.night;
}
function paintSky(){
  const [a,b]=skyAt(Date.now());
  document.documentElement.style.setProperty("--sky1",a); document.documentElement.style.setProperty("--sky2",b);
}
const cv=$("bg"), ctx=cv.getContext("2d"); let W=0,Hc=0,DPR=1, stars=[], streaks=[];
function resize(){
  DPR=Math.min(window.devicePixelRatio||1, CFG.LITE?1:1.5); W=innerWidth; Hc=innerHeight;
  cv.width=W*DPR; cv.height=Hc*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*Hc*0.55,r:Math.random()*1.2+0.3,p:Math.random()*6}));
  streaks=Array.from({length:14},()=>({x:Math.random()*W,y:Math.random()*Hc*0.6,l:30+Math.random()*60,o:Math.random()}));
}
addEventListener("resize",resize); resize();
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden) return;
  if(t-last < (CFG.LITE?66:33)) return;            // ~30 fps (15 en modo lite)
  const dt=(t-last)/1000; last=t;
  ctx.clearRect(0,0,W,Hc);
  const now=Date.now(), {rise,set}=SCENE, night=!rise||now<rise-1800000||now>set+1800000;
  // estrellas
  if(night){ for(const s of stars){ ctx.globalAlpha=0.35+0.35*Math.sin(t/900+s.p); ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.3); ctx.fill(); } ctx.globalAlpha=1; }
  // viento: rayas que cruzan en la dirección real (componente horizontal: viento del O va hacia el E = derecha)
  const toward=(SCENE.wd+180)%360, vx=Math.sin(rad(toward)), vy=-Math.cos(rad(toward))*0.25, sp=10+SCENE.ws*6;
  ctx.lineCap="round";
  for(const s of streaks){
    s.x+=vx*sp*dt; s.y+=vy*sp*dt*0.3; s.o+=dt*0.25;
    if(s.x<-100||s.x>W+100||s.o>1){ s.x=vx>0?-80:W+80; s.x=Math.random()*W; s.y=Math.random()*Hc*0.6; s.o=0; }
    const a=Math.sin(s.o*Math.PI)*0.10*clamp(SCENE.ws/20,0.3,1.2);
    ctx.strokeStyle=`rgba(255,255,255,${a})`; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-vx*s.l,s.y-vy*s.l); ctx.stroke();
  }
  // mar: 4 capas; amplitud = ola real, velocidad/largo = período, nivel = marea
  const amp=clamp(6+SCENE.hb*26,6,58), lam=clamp(SCENE.Tp*70,260,1100), base=Hc*0.80 - SCENE.eta*40;
  const T0=t/1000;
  const layers=[
    {y:base-40,a:amp*0.45,l:lam*0.7,s:0.6,c:"rgba(58,160,255,0.10)"},
    {y:base-18,a:amp*0.65,l:lam*0.85,s:0.8,c:"rgba(47,224,200,0.10)"},
    {y:base,   a:amp*0.85,l:lam,     s:1.0,c:"rgba(20,90,140,0.30)"},
    {y:base+26,a:amp,     l:lam*1.15,s:1.2,c:"rgba(8,40,70,0.55)"},
  ];
  for(const L of layers){
    const k=2*Math.PI/L.l, w=2*Math.PI/SCENE.Tp*L.s*0.35;
    ctx.beginPath(); ctx.moveTo(0,Hc);
    for(let x=0;x<=W+10;x+=10){
      const ph=k*x - w*T0*6;
      const y=L.y - L.a*(Math.sin(ph)*0.75 + Math.sin(ph*2.1+1.3)*0.18 + Math.sin(ph*0.47+0.4)*0.25);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,Hc); ctx.closePath(); ctx.fillStyle=L.c; ctx.fill();
  }
  // espuma en la cresta de la capa frontal
  const L=layers[3], k=2*Math.PI/L.l, w=2*Math.PI/SCENE.Tp*L.s*0.35;
  ctx.beginPath();
  for(let x=0;x<=W+10;x+=10){ const ph=k*x-w*T0*6; const y=L.y-L.a*(Math.sin(ph)*0.75+Math.sin(ph*2.1+1.3)*0.18+Math.sin(ph*0.47+0.4)*0.25); x?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=1.5; ctx.stroke();
}
requestAnimationFrame(frame);

/* ===================== RELOJ ===================== */
function tick(){
  const d=new Date();
  $("clk").textContent=d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false});
  const ds=d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}); $("date").textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
}
tick(); setInterval(tick,10000);

/* ===================== RATINGS ===================== */
const getRatings=()=>{ try{ return JSON.parse(localStorage.getItem("pg_ratings")||"[]"); }catch(e){ return []; } };
function renderRateMeta(){
  const R=getRatings(), n=R.length, today=new Date().toDateString();
  const rated=R.some(r=>new Date(r.ts).toDateString()===today);
  $("rateMeta").textContent = rated?`${n} ratings · confianza ${n<10?"baja":n<40?"media":"alta"}`:`hoy sin calificar · ${n} en total`;
}
const sel={src:"agua"};
document.querySelectorAll(".opts").forEach(g=>g.addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b) return;
  g.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel[g.dataset.k]=b.dataset.v;
}));
$("rateBtn").onclick=()=>{ $("rateWhen").textContent="Se guarda con la hora exacta: "+new Date().toLocaleString("es-AR",{hour12:false}); $("modal").classList.add("open"); };
$("cancel").onclick=()=>$("modal").classList.remove("open");
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") $("modal").classList.remove("open"); });
$("save").onclick=async()=>{
  if(!sel.spot||!sel.size||!sel.stars){ toast("Elegí pico, tamaño y calidad"); return; }
  const now=Date.now(), h=D.H[currentHourIdx()], r=evalHour(h,sel.spot);
  const rec={ ts:new Date(now).toISOString(), spot:sel.spot, size:sel.size, size_m:SIZE_M[sel.size], stars:+sel.stars, src:sel.src,
    forecast:{hour:h.t, parts:h.parts, wind:{spd:h.ws,dir:h.wd,gust:h.wg}, ww:h.ww, eta:r.ti.y, rising:r.ti.rising, min_to_turn:r.ti.near?Math.round(r.ti.near.dm):null, sst:h.sst},
    pred:{hb:+r.hb.toFixed(2), stars:r.stars, gamma:+r.g.toFixed(2), bombeo:r.bombeo, model:"v2"} };
  const all=getRatings(); all.push(rec); localStorage.setItem("pg_ratings",JSON.stringify(all));
  if(CFG.SHEETS_URL){ try{ await fetch(CFG.SHEETS_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(rec)}); }catch(e){} }
  $("modal").classList.remove("open"); ["spot","size","stars"].forEach(k=>delete sel[k]);
  document.querySelectorAll('.opts:not([data-k="src"]) .opt').forEach(x=>x.classList.remove("sel"));
  toast("Guardado ✓ gracias por entrenar el modelo"); renderRateMeta();
};
$("expJson").onclick=()=>{ const b=new Blob([JSON.stringify(getRatings(),null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`ratings_playagrande_${new Date().toISOString().slice(0,10)}.json`; a.click(); };
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2000); }

/* ===================== ARRANQUE ===================== */
async function refresh(){
  try{ await load(); $("err").style.display="none"; }
  catch(e){ const c=localStorage.getItem("pg_cache"); if(c) D=JSON.parse(c);
    $("err").style.display="block"; $("err").textContent="Sin conexión con Open-Meteo"+(c?" · mostrando últimos datos":""); if(!D) return; }
  render();
}
refresh();
setInterval(refresh, CFG.REFRESH_MIN*60000);
setInterval(()=>{ if(D) render(); }, 5*60000);
if("wakeLock" in navigator){ const wl=()=>navigator.wakeLock.request("screen").catch(()=>{}); wl(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") wl(); }); }
</script>
